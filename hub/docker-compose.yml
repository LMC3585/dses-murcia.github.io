# Jarvis hub: Home Assistant (device brain) + n8n (automation glue).
# Run on any always-on Linux box: a cheap cloud VM, a Raspberry Pi, or a mini PC.
#
#   1. Copy this folder to the server:      scp -r hub user@server:~/jarvis
#   2. Set the two placeholders below (timezone, n8n encryption key).
#   3. Start:                                docker compose up -d
#   4. Open Home Assistant on port 8123 and finish onboarding.
#
# If you are using a Raspberry Pi with no other workloads, Home Assistant OS
# (the official image flashed to the SD card) is simpler than Docker and adds
# an add-on store. Use this compose file for a VPS or a shared machine.

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    # host networking is required for device discovery (mDNS, SSDP) on a home LAN.
    network_mode: host
    # privileged is only needed for USB radios (Zigbee/Z-Wave sticks). Remove it on a cloud VM.
    privileged: true
    environment:
      - TZ=Asia/Manila
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Manila
      - TZ=Asia/Manila
      # Public URL n8n uses to build webhook addresses. Set to your HTTPS address.
      - WEBHOOK_URL=https://n8n.example.com/
      # Generate once with: openssl rand -hex 32   (losing it makes stored credentials unreadable)
      - N8N_ENCRYPTION_KEY=CHANGE_ME
      - N8N_SECURE_COOKIE=true
    volumes:
      - ./n8n:/home/node/.n8n
